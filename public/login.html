<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Вход — ROLTHALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#2E2B35;--charcoal-deep:#1e1c24;--charcoal-mid:#26232e;
  --light:#D9D9D9;--accent:#ffffff;--accent-border:rgba(255,255,255,0.12);
  --danger:rgba(255,100,100,.9);--font:'Unbounded',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--charcoal-deep);color:var(--light);min-height:100vh;display:flex;flex-direction:column;}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;background:rgba(30,28,36,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--accent-border);}
.nav-logo svg{height:16px;width:auto;display:block;}
.nav-back{font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(217,217,217,.45);text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--light);}

/* ── PAGE ── */
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:100px 24px 80px;}
.login-wrap{width:100%;max-width:420px;}
.page-eyebrow{font-size:8px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(217,217,217,.3);margin-bottom:12px;}
.page-title{font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--accent);letter-spacing:-.02em;margin-bottom:32px;}
.login-card{border:1px solid var(--accent-border);background:var(--charcoal-mid);padding:32px;}
.login-hint{font-size:10px;font-weight:300;color:rgba(217,217,217,.45);line-height:1.7;margin-bottom:24px;}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.form-label{font-size:8px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(217,217,217,.4);}
.form-input{width:100%;background:var(--charcoal-deep);border:1px solid var(--accent-border);color:var(--light);font-family:var(--font);font-size:13px;padding:14px 16px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:rgba(255,255,255,.4);}
.login-error{font-size:10px;color:var(--danger);margin-top:12px;line-height:1.6;display:none;}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--accent);color:var(--charcoal);border:none;cursor:pointer;transition:opacity .2s;width:100%;padding:16px;}
.btn-primary:hover{opacity:.88;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
#loginBtn{font-size:.72rem;padding:10px 18px;border-radius:10px;font-weight:600;gap:7px;letter-spacing:.04em;}

@media(max-width:1023px){
  nav{display:none;}
  .page{padding:80px 20px 60px;}
}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Desktop nav -->
<nav>
  <a href="/" class="nav-logo">
    <svg width="1280" height="71" viewBox="0 0 1280 71" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#c0)"><path d="M0 70.0138V0.986328H103.497C120.746 0.986328 131.095 14.7922 131.095 28.5971C131.095 42.402 120.746 56.2079 103.497 56.2079H31.1472V70.0138H0ZM31.1472 24.653V32.5422H95.6108C98.3707 32.5422 99.9473 31.0628 99.9473 28.5981C99.9473 26.1334 98.3697 24.654 95.6108 24.654H31.1472V24.653Z" fill="white"/><path d="M242.477 0C261.501 0 276.976 16.4682 276.976 35.5C276.976 54.5318 261.501 71 242.477 71H170.522C151.498 71 136.023 54.5318 136.023 35.5C136.023 16.4682 151.498 0 170.522 0H242.477ZM176.929 25.6392C171.508 25.6392 167.072 30.0765 167.072 35.5C167.072 40.9235 171.508 45.3608 176.929 45.3608H236.07C241.491 45.3608 245.927 40.9235 245.927 35.5C245.927 30.0765 241.491 25.6392 236.07 25.6392H176.929Z" fill="white"/><path d="M303.194 70.0138H268.103L323.991 0.986328H359.082L414.97 70.0138H379.88L341.536 22.6804L303.193 70.0138H303.194Z" fill="white"/><path d="M443.161 24.653H393.285V0.986328H524.381V24.653H474.308V70.0138H443.161V24.653Z" fill="white"/><path d="M663.361 70.0138H632.214V30.5697L563.414 70.0138H532.267V0.986328H563.414V40.4304L632.213 0.986328H663.36V70.0138H663.361Z" fill="white"/><path d="M765.87 0.986328L791.301 19.2295L816.731 0.986328H860.692L813.281 35.0069L862.073 70.0138H818.111L791.301 50.7844L764.49 70.0138H720.529L769.321 35.0069L721.909 0.986328H765.87Z" fill="white"/><path d="M958.669 0C977.692 0 993.168 16.4682 993.168 35.5C993.168 54.5318 977.692 71 958.669 71H886.715C867.691 71 852.216 54.5318 852.216 35.5C852.216 16.4682 867.69 0 886.715 0H958.669ZM893.121 25.6392C887.7 25.6392 883.264 30.0765 883.264 35.5C883.264 40.9235 887.7 45.3608 893.121 45.3608H952.262C957.683 45.3608 962.118 40.9235 962.118 35.5C962.118 30.0765 957.683 25.6392 952.262 25.6392H893.121Z" fill="white"/><path d="M1019.39 70.0138H984.296L1040.18 0.986328H1075.27L1131.16 70.0138H1096.07L1057.73 22.6804L1019.39 70.0138H1019.39Z" fill="white"/><path d="M1168.22 70.0138H1133.13L1189.02 0.986328H1224.11L1280 70.0138H1244.91L1206.57 22.6804L1168.22 70.0138H1168.22Z" fill="white"/></g><defs><clipPath id="c0"><rect width="1280" height="71" fill="white"/></clipPath></defs></svg>
  </a>
  <a href="/" class="nav-back">← На главную</a>
</nav>

<div class="page">
  <div class="login-wrap">
    <div class="page-eyebrow">Личный кабинет</div>
    <div class="page-title">Войти</div>
    <div class="login-card">
      <div class="login-hint">Введите телефон и email, которые указывали при бронировании</div>
      <div class="form-group">
        <label class="form-label">Телефон</label>
        <input type="tel" class="form-input" id="lPhone" placeholder="+7 (___) ___-__-__" autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="lEmail" placeholder="your@email.com" autocomplete="email">
      </div>
      <div id="loginError" class="login-error"></div>
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Войти</button>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'rh_profile_token';

// Если уже залогинен — редиректим сразу
if (sessionStorage.getItem(TOKEN_KEY)) window.location.href = '/profile';
if (localStorage.getItem('rh_token')) window.location.href = '/admin';

function initPhoneMask(el) {
  function fmt(raw) {
    let d = raw.replace(/\D/g, '');
    if (d.startsWith('8')) d = '7' + d.slice(1);
    if (!d.startsWith('7')) d = '7' + d;
    d = d.slice(0, 11);
    let s = '+7';
    if (d.length > 1) s += ' (' + d.slice(1, 4);
    if (d.length >= 4) s += ')';
    if (d.length > 4) s += ' ' + d.slice(4, 7);
    if (d.length > 7) s += '-' + d.slice(7, 9);
    if (d.length > 9) s += '-' + d.slice(9, 11);
    return s;
  }
  el.addEventListener('focus', () => { if (!el.value) el.value = '+7'; });
  el.addEventListener('blur',  () => { if (el.value === '+7') el.value = ''; });
  el.addEventListener('input', function() {
    const pos = this.selectionStart, prev = this.value;
    this.value = fmt(this.value);
    const diff = this.value.length - prev.length;
    this.setSelectionRange(pos + diff, pos + diff);
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && (this.value === '+7' || this.value === '+7 (')) {
      e.preventDefault(); this.value = '';
    }
  });
}

function showErr(msg) {
  const e = document.getElementById('loginError');
  e.textContent = msg; e.style.display = 'block';
}

let _hp = '';

async function doLogin() {
  const rawPhone = document.getElementById('lPhone').value.trim();
  const digits   = rawPhone.replace(/\D/g, '');
  const phone    = digits.length >= 10 ? '+' + (digits.length === 10 ? '7' + digits : digits) : rawPhone;
  const email    = document.getElementById('lEmail').value.trim();
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('loginError');

  errEl.style.display = 'none';
  if (!rawPhone || !email) { showErr('Заполните оба поля'); return; }
  if (digits.length < 10)  { showErr('Введите корректный номер телефона'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Введите корректный email'); return; }
  if (_hp) { showErr('Пожалуйста, обновите страницу и попробуйте снова.'); return; }

  btn.disabled = true; btn.textContent = 'Проверяем…';

  try {
    const res  = await fetch('/api/auth/unified-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ phone, email }),
    });

    if (res.status === 429) { showErr('Слишком много попыток. Подождите минуту и попробуйте снова.'); return; }

    const data = await res.json();

    if (!data.ok) { showErr(data.error || 'Пользователь не найден'); return; }

    if (data.redirect_to === '/admin') {
      localStorage.setItem('rh_token', data.token);
      localStorage.setItem('rh_user', JSON.stringify(data.user));
      window.location.href = '/admin';
    } else {
      sessionStorage.setItem(TOKEN_KEY, data.token);
      window.location.href = '/profile';
    }
  } catch(e) {
    showErr('Ошибка соединения. Попробуйте ещё раз.');
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

function initEmailMask(el) {
  el.addEventListener('input', function() {
    const clean = this.value.replace(/[^\x20-\x7E]/g, '');
    if (clean !== this.value) this.value = clean;
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  // Honeypot: создаём через JS — браузер не автозаполняет динамически созданные поля
  const hpWrap = document.createElement('div');
  hpWrap.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;';
  hpWrap.setAttribute('aria-hidden', 'true');
  const hpEl = document.createElement('input');
  hpEl.type = 'text'; hpEl.tabIndex = -1; hpEl.autocomplete = 'off';
  hpEl.addEventListener('input', () => { _hp = hpEl.value; });
  hpWrap.appendChild(hpEl);
  document.querySelector('.login-card').appendChild(hpWrap);

  const phoneEl = document.getElementById('lPhone');
  const emailEl = document.getElementById('lEmail');
  initPhoneMask(phoneEl);
  initEmailMask(emailEl);
  phoneEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // Подставляем данные из формы бронирования если были
  const form = sessionStorage.getItem('rh_booking_form');
  if (form) {
    try {
      const d = JSON.parse(form);
      if (d.phone) phoneEl.value = d.phone;
      if (d.email) emailEl.value = d.email;
    } catch(_) {}
  }

  // Автовход через Telegram WebApp
  const initData = window.Telegram?.WebApp?.initData;
  if (initData) {
    try {
      const res  = await fetch('/api/profile/tg-login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body:    JSON.stringify({ init_data: initData }),
      });
      const data = await res.json();
      if (data.ok) {
        if (data.redirect_to === '/admin') {
          localStorage.setItem('rh_token', data.token);
          window.location.href = '/admin';
        } else {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          window.location.href = '/profile';
        }
      }
    } catch(_) {}
  }
});
</script>
<script src="/js/mob-header.js"></script>
</body>
</html>
